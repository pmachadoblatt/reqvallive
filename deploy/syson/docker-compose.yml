# SysON local (single-user, sem auth) — lab e casa usam o mesmo ficheiro via Git.
# Docs: https://doc.mbse-syson.org/syson/v2025.6.0/installation-guide/how-tos/install/local_test.html
#
# Porta no PC: 8081 (ReqValLive já usa 8080).
# Em ARM (Mac Silicon): defina DOCKER_DEFAULT_PLATFORM=linux/amd64 antes do up.

services:
  database:
    image: postgres:12
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: username
      POSTGRES_PASSWORD: password
    volumes:
      # Persiste projetos entre `docker compose down` (sem -v) e reinícios.
      - syson_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U username -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - syson

  app:
    image: "${IMAGE_TAG:-eclipsesyson/syson:v2025.6.0}"
    ports:
      - "${SYSON_HOST_PORT:-8081}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database/postgres
      SPRING_DATASOURCE_USERNAME: username
      SPRING_DATASOURCE_PASSWORD: password
      SIRIUS_COMPONENTS_CORS_ALLOWEDORIGINPATTERNS: "*"
      SERVER_PORT: 8080
    depends_on:
      database:
        condition: service_healthy
    networks:
      - syson

volumes:
  syson_pgdata:

networks:
  syson:
